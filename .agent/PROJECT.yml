project:
  name: "heritage_com"
  type: "application"
  lifecycle: "recovery"
  risk: "production"

gee_os:
  minimum_version: "0.10.1"
  primary_mode: "EXISTING-APPLICATION"
  workflows:
    - "CHANGE-SAFETY"
    - "PROJECT-RECOVERY"
  conditional_workflows:
    - "PWA-RELEASE"
    - "WEBSITE-LAUNCH"
    - "RELEASE-GATE"

sources_of_truth:
  project_memory: "CLAUDE.md (short entry point)"
  project_context: "docs/00-foundation/PROJECT-CONTEXT.md"
  product_overview: "docs/01-product/PRODUCT-SPEC.md (README.md is the front page)"
  implementation: "source tree and package.json"
  detailed_documentation: "docs/ in the GEE OS Full Product hierarchy (00-foundation to 09-release); index docs/README.md"
  content_and_social: "docs/01-product/CONTENT.md, docs/01-product/SOCIAL.md"
  architecture: "docs/02-architecture/"
  design: "docs/03-design/"
  pwa: "docs/04-pwa/"
  security: "docs/05-security/"
  operations: "docs/07-operations/"
  decisions: "docs/08-change-management/DECISIONS.md"
  roadmap_and_status: "docs/08-change-management/ROADMAP.md"
  release_decision: "docs/09-release/RELEASE-REPORT.md"
  plan_of_record: "docs/Plans 2026/ (approved 10 October 2026; docs/08-change-management wins where they differ)"
  evidence: "qa/"
  known_issues: "KNOWN-ISSUES.md"
  changelog: "CHANGELOG.md"
  current_task: ".agent/CURRENT-TASK.md"
  integration_authority: ".agent/MCP-PROFILE.yml"

exclusions:
  - "push, merge or rebase of main (pushing main deploys)"
  - "deployment, production mutation or external messages"
  - "secret copying or credential discovery"
  - "schema migrations without an approved task contract"

machines:
  primary: mac-primary        # owns env files and secrets
  secondary: ubuntu-build     # builds and tests published branches
  code_transport: github      # small focused commits, pushed per verified batch
  env_files: primary-only     # never committed, never copied between computers

mcp_profile: ".agent/MCP-PROFILE.yml"
