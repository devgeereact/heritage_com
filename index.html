<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeritOS — Herit Clothing Operations</title>

  <!-- Herit brand fonts: Poppins (sans), Libre Baskerville (serif display), IBM Plex Mono (labels) -->
  <!-- Inter / Source Serif 4 / JetBrains Mono kept for legacy admin components -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />

  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #fbf7f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 9999;
      opacity: 1;
      overflow: hidden;
    }

    #splash-screen .splash-mark {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #9b2c2c;
    }

    #splash-screen .splash-mark span { color: #b45309; }

    #splash-screen .splash-bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(155, 44, 44, 0.18);
      overflow: hidden;
      position: relative;
    }

    #splash-screen .splash-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #9b2c2c, #b45309);
      transform: translateX(-100%);
      animation: splash-slide 1.1s ease-in-out infinite;
    }

    @keyframes splash-slide {
      to { transform: translateX(100%); }
    }

    #splash-screen.remove {
      animation: fadeout 0.5s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <div id="splash-screen">
    <div class="splash-mark">Herit<span>OS</span></div>
    <div class="splash-bar"></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });
  </script>
</body>

</html>
