<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeritOS | Herit Clothing</title>

  <!-- PWA: installable + offline-capable -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#171A20" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HeritOS" />

  <!-- Herit premium brand fonts: Inter (UI/body), Source Serif 4 (serif display), IBM Plex Mono (data/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #FFFBEB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 9999;
      opacity: 1;
      overflow: hidden;
    }

    #splash-screen .splash-mark {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #262626;
    }

    #splash-screen .splash-mark span { color: #F59E0B; }

    #splash-screen .splash-bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(146, 64, 14, 0.16);
      overflow: hidden;
      position: relative;
    }

    #splash-screen .splash-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #262626, #F59E0B);
      transform: translateX(-100%);
      animation: splash-slide 1.1s ease-in-out infinite;
    }

    @keyframes splash-slide {
      to { transform: translateX(100%); }
    }

    #splash-screen.remove {
      animation: fadeout 0.5s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <div id="splash-screen">
    <div class="splash-mark">Herit<span>OS</span></div>
    <div class="splash-bar"></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });
  </script>
  <script>
    // Register the PWA service worker (production only; ignore on localhost dev).
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
