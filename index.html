<!doctype html>
<html lang="en-NG">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeritOS | Herit Clothing</title>

  <!-- PWA: installable + offline-capable -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0E0D0B" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HeritOS" />

  <!-- Fonts: Inter (UI and body) and Fraunces (headings, D-023), variable
       weight ranges, font-display swap. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&display=swap" rel="stylesheet" />

  <style>
    /* Staff splash only: public paths hide it before first paint (below). */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 9999;
      opacity: 1;
      overflow: hidden;
    }
    #splash-screen .splash-mark {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 600;
      color: #171A20;
    }
    #splash-screen .splash-bar {
      width: 120px;
      height: 2px;
      background: #F4F4F4;
      overflow: hidden;
      position: relative;
    }
    #splash-screen .splash-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #171A20;
      transform: translateX(-100%);
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide { to { transform: translateX(100%); } }
    #splash-screen.remove { animation: fadeout 0.3s forwards; z-index: 0; }
    @keyframes fadeout { to { opacity: 0; visibility: hidden; } }
    html.hc-public-boot #splash-screen { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #splash-screen .splash-bar::after { animation: none; transform: none; }
    }
  </style>
  <script>
    // Public pages show no splash: hide it before first paint.
    if (/^\/(?:$|about|services|work|how-it-works|company-orders|faqs|privacy|terms|shop|cart|checkout|gifting|contact|journal|track|account|access|book)(?:\/|$)/.test(location.pathname)) {
      document.documentElement.classList.add('hc-public-boot');
    }
  </script>

</head>

<body>
  <div id="root"></div>
  <div id="splash-screen">
    <div class="splash-mark">Herit<span>OS</span></div>
    <div class="splash-bar"></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });
  </script>
  <script>
    // Register the PWA service worker (production only; ignore on localhost dev).
    if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
