name: CI

# Until now the only workflow here was deploy.yml, which runs on push to main —
# so the first thing to notice a broken build was the live site. Nothing ran on
# a pull request at all.
#
# There is no typecheck job on purpose. The project is JavaScript only (src/ has
# no .ts files; jsconfig.json holds the editor path aliases), so a
# `tsc --noEmit` gate here would check nothing and give false assurance. If
# this project ever moves to TypeScript, add it then; see gakinz_com and
# ritagreen_os, which are TS and do gate on it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the previous run for the same ref, but never on main —
# a cancelled main run leaves the branch with no verdict at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` deliberately, not `npm install`: it installs the lockfile
      # exactly and fails on a lockfile that cannot be satisfied. `npm install`
      # succeeding proves nothing about `npm ci` — it rewrites the lockfile to
      # make itself work.
      - run: npm ci

      - run: npm run lint

      # Frontend tests (Vitest, jsdom): the API client, role gates, helpers, the
      # HTML sanitiser and the sign-in, offline banner, enquiry and booking flows.
      # No server or database; fetch is mocked. See docs/TEST-STRATEGY.md.
      - name: Frontend tests
        run: npm test

      # The build is the real gate: deploy.yml ships whatever `vite build`
      # produces, so a build that fails here is a deploy that would have shipped
      # a broken site.
      - run: npm run build

      # The PHP API is the other half of every deploy, so check it here too.
      # ubuntu-latest ships with PHP preinstalled, which is enough for a syntax
      # check and the helper tests (no database, no network, no extensions).
      - name: PHP syntax check
        run: |
          php --version
          for f in php-api/*.php php-api/tests/*.php; do
            php -l "$f" || exit 1
          done

      - name: PHP helper tests
        run: php php-api/tests/run.php

      # Documentation stays in step with the code (.claude/rules/docs-sync.md):
      # fails on broken Markdown links or anchors, em dashes in live docs, and
      # mentions of docs/ or qa/ paths that do not exist. Node only, no deps.
      - name: Docs check
        run: node scripts/check-docs.mjs
